  Fifty-four probes across nine hosts returned 404 (group and market-unit web
  estates), 502 (the Imperva-fronted api.bupa.com.au APIM gateway), 401
  (api.bupa.cl), or HTTP 200 with an HTML body that is a single-page-app shell
  or a WAF block page rather than a discovery document. Every HTTP 200 below
  was opened and its Content-Type and first bytes checked; none is a real
  well-known document, so no `WellKnown` or `SecurityTxt` pointer is wired into
  apis.yml. The one genuine OpenID Connect discovery document reachable in
  Bupa's identity path is Microsoft-hosted, for the Entra ID tenant that fronts
  the Bupa Chile API portal, and is captured separately below.
