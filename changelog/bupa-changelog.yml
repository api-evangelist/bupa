note: >-
  Bupa Australia publishes an API changelog route on its Azure API Management
  developer portal. The route is real and provider-declared — it appears in the
  portal's own https://portal.api.bupa.com.au/sitemap.xml with lastmod
  2026-06-17T08:04:22.066Z, returns HTTP 200, carries the page title "APIs:
  Changelog - Bupa Developer Portal" and renders the heading "API Updates".
  Its entries are not readable anonymously: like every other catalog view in
  the portal, it is populated client-side from the APIM management endpoint
  https://management.api.internal.bupa.com.au/... (service banzprodapim01),
  an internal-only host that does not resolve publicly. `entries: []` therefore
  records "no entries readable without a partner account", not "no changes
  shipped". Nothing has been invented to fill it. Re-run this artifact if Bupa
  ever opens the portal catalog to anonymous visitors.
