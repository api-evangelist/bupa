- name: Portal de APIs Bupa (Bupa Chile)
  description: >-
    The Bupa Chile API portal at apidoc.bupa.cl — an Angular single-page
    application that ships Swagger UI and renders API definitions fetched from
    the backend controller at https://api.bupa.cl/portal/ms-controller. Every
    anonymous request to that backend returns HTTP 401, so no definition can be
    read without credentials. Access is fronted by Microsoft Entra ID
    (authority login.microsoftonline.com tenant
    6faad805-0755-4412-981c-e2d4e4021ee7, client_id
    744efffa-f93d-4137-b874-cef142712fa6, redirect
    https://apidoc.bupa.cl/public/login), whose OpenID Connect discovery
    document is publicly readable and is captured verbatim in well-known/. The
    portal is a login wall rather than a self-serve developer surface.
  humanURL: https://apidoc.bupa.cl/
  baseURL: https://api.bupa.cl/portal/ms-controller
  tags:
  - Insurance
  - Health Insurance
  - Chile
  - Partner Gated
  - Login Wall
  properties:
  - type: DeveloperPortal
    url: https://apidoc.bupa.cl/
  - type: Authentication
    url: authentication/bupa-authentication.yml
