apis:
- name: Bupa Australia APIs (Integration Fabric)
  description: >-
    The Bupa Australia API estate, published through an Azure API Management
    managed developer portal at portal.api.bupa.com.au and served from the
    api.bupa.com.au gateway host. The portal is publicly reachable (HTTP 200)
    and its own sitemap.xml declares Products, APIs, API Details and API
    Changelog routes, but the catalog renders client-side against an
    internal-only APIM management endpoint
    (management.api.internal.bupa.com.au, service banzprodapim01) and is
    therefore empty for anonymous visitors. Bupa's onboarding copy makes the
    gating explicit: "Contact the Bupa Integration Fabric Team with your
    interest to get access to our API specifications." The gateway host
    api.bupa.com.au resolves behind Imperva and returns HTTP 502 to anonymous
    callers, including for /openapi.json, /swagger.json, /api-docs and
    /.well-known/openid-configuration. No OpenAPI definition is retrievable
    without a partner agreement.
  humanURL: https://portal.api.bupa.com.au/
  baseURL: https://api.bupa.com.au
  tags:
  - Insurance
  - Health Insurance
  - Australia
  - Partner Gated
  - Azure API Management
