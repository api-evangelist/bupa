name: Bupa
kind: company
description: >-
  Bupa is a United Kingdom headquartered international healthcare group that
  writes private medical insurance and also runs the clinics, dental practices,
  hospitals and aged-care homes that deliver the care it funds. It has no
  shareholders, is owned by the British United Provident Association Limited
  and reinvests its profits, and operates market units across the UK, Australia
  and New Zealand, Spain and Latin America (Sanitas, Bupa Chile), Turkiye,
  Poland, Hong Kong SAR, India and the Middle East, plus the Bupa Global
  international private medical insurance business. Its lines of business are
  health insurance, health provision and aged care rather than property and
  casualty or life, so the ACORD data standards that shape the rest of the
  insurance sector are absent from its published surface. Bupa's API posture is
  partner-gated: the group site bupa.com publishes no developer portal at all
  (developer, developers, docs and api subdomains do not resolve, and
  /developers, /api and /developer return 404), and the only first-party
  developer surfaces belong to market units. Bupa Australia runs a real Azure
  API Management developer portal at portal.api.bupa.com.au that returns HTTP
  200 but lists no APIs publicly, instructing prospective consumers to contact
  the Bupa Integration Fabric Team to get access to API specifications; Bupa
  Chile runs apidoc.bupa.cl behind a Microsoft Entra ID login wall whose
  backend returns HTTP 401 to anonymous callers; and the Bupa Global portal
  host api-portal.bupaglobal.com no longer resolves. No public OpenAPI or
  Swagger definition, no Postman collection, no GraphQL or gRPC surface, and no
  event or webhook catalog could be confirmed anywhere on Bupa's public web
  estate as of 2026-07-25, and none of the four insurance API verbs — quote,
  bind, issue or FNOL — is exposed to unauthenticated developers.
