regulatory_context:
  home_market: United Kingdom
  open_insurance_mandate: false
  note: >-
    The UK has the FCA and PRA but no open-insurance rule; the FCA's Open
    Finance work remains at consultation stage, and the London Market's
    Blueprint Two modernisation targets brokers and syndicates in the
    subscription P&C market, not a life-and-health carrier. Australia's
    Consumer Data Right has a designated banking, energy and
    non-bank-lending scope; private health insurance has not been designated,
    so no CDR obligation reaches the Bupa Australia estate either. Absence of
    a public API surface is therefore the expected, unpenalised posture rather
    than a compliance failure.
