note: >-
  Bupa publishes no OpenAPI, so no standard can be derived from a spec. Each
  assertion below is either evidenced from a live surface or recorded as
  unknown. "conforms: false" here means "no public evidence of conformance",
  not "Bupa is known not to conform" — a partner-gated estate can implement any
  of these internally without publishing it. No compliance certification is
  published by Bupa for its API estate, so no `Compliance` pointer is wired.
standards:
